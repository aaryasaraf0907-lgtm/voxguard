[project]
name = "voxguard"
version = "0.1.0"
description = "Codec-aware voice-deepfake (vishing) detector for telephone-quality audio."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Training / evaluation / real detector. Heavy: not installed in CI or the API image.
ml = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "transformers>=4.40",
    "soundfile>=0.12",
    "librosa>=0.10",
    "scikit-learn>=1.4",
    "huggingface-hub>=0.23",
    "wandb>=0.17",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=13",  # WebSocket support in uvicorn (/v1/stream) and the stream_call.py client
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "soundfile>=0.12",
]
ui = [
    "streamlit>=1.49",
    "requests>=2.31",
]
# Figures in docs/results.md (evaluate.py). Optional: without it only the figures are skipped.
plots = [
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=7.0",
    "ruff>=0.5",
]
# Browser end-to-end tests (tests/e2e, make e2e). Opt-in: `uv sync --group e2e`, then
# `uv run playwright install chromium`.
e2e = [
    "playwright>=1.55",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxguard"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.report]
# Floor = the total measured in CI's configuration (no torch, so ML code is partly skipped) on
# 18 Nov 2026, 68 %, minus 2 points. Raise it as coverage grows; never lower it to pass.
fail_under = 66

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: needs model weights or large data; skipped in CI",
    "e2e: drives the demo in headless Chromium (opt-in: VOXGUARD_E2E_TESTS=1)",
]
