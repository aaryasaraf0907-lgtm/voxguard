# Local `streamlit run` settings. The API rejects uploads above VOXGUARD_MAX_UPLOAD_MB (25 MB by
# default), so the uploader uses the same limit instead of Streamlit's 200 MB default.
[server]
maxUploadSize = 25

[browser]
gatherUsageStats = false

[client]
# Hide Streamlit's developer options (Deploy, Rerun, Clear cache) in the demo; viewer options
# (theme, print, record screen) stay. The Docker images set STREAMLIT_CLIENT_TOOLBAR_MODE instead.
toolbarMode = "viewer"
