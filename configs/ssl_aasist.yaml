# SSL-AASIST: XLS-R 300M front-end + AASIST back-end on ASVspoof 2019 LA.
# Paper settings (Tak et al. 2022): Adam lr 1e-6, weight decay 1e-4, batch 14, weighted CE
# 0.9 on bona fide / 0.1 on spoof, full fine-tuning, 100 epochs. (The reference code writes
# [0.1, 0.9] because it labels bona fide 1; we label fake 1, so ours is [0.9, 0.1].) Deviations here (documented for the report):
#   - epochs 8: free Kaggle GPU time. Measured on 2x T4 (full fine-tune, batch 14): ~5-6 train
#     clips/s, so one 25,380-clip epoch is ~80 min; run as 4 + 4 epochs (resume) to stay inside
#     Kaggle's 12 h session limit. best.pt is kept by dev EER.
#   - train_samples_per_epoch 25380: the codec-augmented manifest (clean + 2 codec copies per
#     clip, 76,140 rows) trains on a fresh random 25,380 rows per epoch, so both runs take the
#     same number of steps. No-op for the clean manifest (25,380 rows).
#   - gradient checkpointing on: fits a 16 GB T4 at batch 14
# Fallback if too slow / OOM: finetune: last_n (last_n: 4) and frontend_lr: 1.0e-5, lr: 1.0e-4.
model:
  name: ssl_aasist
  pretrained: facebook/wav2vec2-xls-r-300m
  finetune: full            # full | last_n | frozen
  last_n: 4                 # used only when finetune: last_n
  gradient_checkpointing: true
  proj_dim: 128
data:
  train_manifests: [data/processed/manifests/asvspoof2019_la_train.csv]
  dev_manifests: [data/processed/manifests/asvspoof2019_la_dev.csv]
  roots: [data/raw, data/processed]
  num_samples: 64600
  # Per-epoch model selection on a fixed seeded dev subset (~500 bona fide); the full dev set
  # with XLS-R costs a large share of each epoch. Final numbers come from evaluate.py.
  dev_max_samples: 5000
  train_samples_per_epoch: 25380
train:
  epochs: 8
  batch_size: 14
  lr: 1.0e-6
  frontend_lr: null         # set to use a separate front-end LR (e.g. with last_n)
  weight_decay: 1.0e-4
  class_weights: [0.9, 0.1] # [bona fide, fake]: up-weight the minority bona fide class
  seed: 1234
  num_workers: 2
  amp: true                 # CUDA only
  out_dir: runs/ssl_aasist_clean
  device: auto
wandb:
  enabled: false
  project: voxguard
