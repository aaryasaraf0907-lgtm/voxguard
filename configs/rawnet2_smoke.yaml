# Smoke test on synthetic clips (mechanics only). Generate them first:
#   uv run python -m voxguard.data.synthetic --n 100
model:
  name: rawnet2
  gru_hidden: 128
  gru_layers: 1
data:
  train_manifests: [data/processed/synthetic/manifests/synthetic_train.csv]
  dev_manifests: [data/processed/synthetic/manifests/synthetic_dev.csv]
  roots: [data/processed/synthetic]
train:
  epochs: 3
  batch_size: 8
  lr: 0.001
  class_weights: [0.5, 0.5]
  out_dir: runs/smoke_rawnet2
