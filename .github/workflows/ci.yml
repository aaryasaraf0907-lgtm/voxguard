name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (core + api + ui extras + dev; no torch, no weights)
        run: uv sync --python 3.11 --extra api --extra ui
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest
