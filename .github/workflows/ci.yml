name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install ffmpeg (real codec tests)
        timeout-minutes: 8
        # Plain-HTTP Ubuntu mirrors stopped answering runners on 11 Nov 2026; fetch over HTTPS instead.
        run: |
          echo "https://mirrors.edge.kernel.org/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
      - name: Install (core + api + ui extras + dev; no torch, no weights)
        run: uv sync --python 3.11 --extra api --extra ui
      - name: Codec availability
        run: uv run python -m voxguard.data.codecs
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest -rs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install test dependencies
        run: uv sync --python 3.11 --extra api --extra ui
      - name: Docker smoke tests (build images, compose up, Space image)
        env:
          VOXGUARD_DOCKER_TESTS: "1"
        run: uv run pytest tests/test_docker_smoke.py -v -s

  docker-ml:
    # INSTALL_ML=1 API image (CPU-only torch, docker/torch-cpu.txt): build check, CUDA audit, and
    # the real detector serving an untrained RawNet2 checkpoint (no token, no private weights).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install test dependencies
        run: uv sync --python 3.11 --extra api --extra ui
      - name: ML image smoke tests
        env:
          VOXGUARD_DOCKER_ML_TESTS: "1"
        run: uv run pytest tests/test_docker_ml.py -v -s
